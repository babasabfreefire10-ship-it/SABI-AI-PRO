
name: Build SABI AI PRO IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q SABI_AI_PRO_TrollStore_CloudBuild.zip -d source

      - name: Build iOS app
        run: |
          cd source
          xcodebuild \
            -project SABI_AI_PRO.xcodeproj \
            -scheme SABI_AI_PRO \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            GENERATE_INFOPLIST_FILE=YES \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SABI_AI_PRO.app Payload/
          zip -qry SABI_AI_PRO_TrollStore.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SABI-AI-PRO-IPA
          path: SABI_AI_PRO_TrollStore.ipa
