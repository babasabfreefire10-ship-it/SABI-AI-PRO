
name: Build SABI AI PRO IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q SABI_AI_PRO_TrollStore_CloudBuild.zip -d source

      - name: Find and build project
        run: |
          PROJECT=$(find source -name "SABI_AI_PRO.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "Xcode project not found"
            exit 1
          fi

          xcodebuild \
            -project "$PROJECT" \
            -scheme SABI_AI_PRO \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SABI_AI_PRO.app Payload/
          zip -qry SABI_AI_PRO_TrollStore.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SABI-AI-PRO-IPA
          path: SABI_AI_PRO_TrollStore.ipa
